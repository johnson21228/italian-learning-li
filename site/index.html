<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Italian Generative Flashcards</title>
  <link rel="stylesheet" href="css/app.css?v=20260812-lesson-filters-v1">
</head>
<body>
  <header class="app-header">
    <p class="eyebrow">Italian Learning LI</p>
    <h1>Flashcard generative</h1>
    <p class="lede">Sei forme per verbo. Ascolta la forma e parla senza il pronome soggetto.</p>
  </header>
  <nav class="view-tabs" aria-label="Flashcard source">
    <button id="classTab" class="view-tab active" type="button" aria-pressed="true">From Class</button>
    <button id="handoutTab" class="view-tab" type="button" aria-pressed="false">From Handouts</button>
  </nav>
  <section class="controls" aria-label="Practice controls">
    <button id="newRoundButton" type="button">Nuovo giro</button>
    <label><input id="showEnglish" type="checkbox" checked> Show English</label>
    <label>Italian voice <select id="voiceSelect"></select></label>
    <p id="voiceStatus">Loading voices…</p>
  </section>
  <section class="readiness" aria-live="polite">
    <strong id="roundStatus"></strong>
    <span id="pendingStatus"></span>
  </section>
  <section id="filterPanel" class="filter-panel" aria-label="Lesson and practice filters">
    <div class="filter-heading"><strong>Categories</strong><span id="activeFilterLabel">All lessons</span></div>
    <div id="filterBar" class="filter-bar" role="toolbar" aria-label="Flashcard category filters"></div>
  </section>
  <main><section id="cards" class="cards" aria-live="polite"></section></main>
  <footer class="footer">Typed class-derived practice. Tap a card to hear Italian.</footer>
  <script src="js/vocabulary-data.js?v=20260812-lesson-filters-v1"></script>
  <script src="js/day7-flashcard-data.js?v=20260812-lesson-filters-v1"></script>
  <script src="js/handout-flashcard-data.js?v=20260730-handout-tabs-v1"></script>
  <script src="js/app.js?v=20260812-lesson-filters-v1"></script>
</body>
</html>
